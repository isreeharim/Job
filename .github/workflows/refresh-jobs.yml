name: Refresh RemoteFlow Jobs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh jobs
        env:
          CRON_URL: ${{ secrets.CRON_URL || 'https://job.sreeharim.site/api/cron' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET GitHub Actions secret"
            exit 1
          fi

          echo "Refreshing job board..."
          response=$(mktemp)
          status=$(curl --silent --show-error             --retry 3             --retry-all-errors             --retry-delay 5             --connect-timeout 15             --max-time 55             -o "$response"             -w "%{http_code}"             -H "Authorization: Bearer $CRON_SECRET"             "$CRON_URL")

          cat "$response"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Refresh endpoint failed with HTTP $status"
            exit 1
          fi
