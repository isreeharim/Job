name: Refresh RemoteFlow Jobs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh jobs
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_URL or CRON_SECRET GitHub secret"
            exit 1
          fi
          curl --fail --silent --show-error             --retry 3             --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$CRON_URL"
