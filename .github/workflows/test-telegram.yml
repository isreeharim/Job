name: Test Telegram Alert

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test Telegram directly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID GitHub secret"
            exit 1
          fi

          response=$(mktemp)
          status=$(curl -sS             -o "$response"             -w "%{http_code}"             -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             -d "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=🔔 RemoteFlow Telegram test successful! Your fresher job alerts are connected. 🚀")

          echo "Telegram API response:"
          cat "$response"
          echo
          echo "HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Telegram test failed"
            exit 1
          fi

      - name: Test Vercel Telegram endpoint
        env:
          CRON_URL: ${{ secrets.CRON_URL || 'https://job.sreeharim.site/api/test-telegram' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET GitHub Actions secret"
            exit 1
          fi

          response=$(mktemp)
          status=$(curl -sS             --connect-timeout 15             --max-time 30             -o "$response"             -w "%{http_code}"             -H "Authorization: Bearer $CRON_SECRET"             "$CRON_URL")

          echo "Vercel API response:"
          cat "$response"
          echo
          echo "HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
